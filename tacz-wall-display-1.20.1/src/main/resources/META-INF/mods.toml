[[mods]]
modId="tacz_wall_display"
version="0.6.6"
displayName="TACZ Wall Display"
authors="Kiyo"
description='''Display equipped TACZ guns as blocks using the P-key placement mode. Right-click to place, Alt+right-click to flip, Alt+scroll to rotate, and break to recover the original gun.
Requires Minecraft 1.20.1, Forge, and TACZ 1.1.8-hotfix (exact version). Recommended Forge: 47.4.21; no platform version requirement is imposed by this addon. Install this mod and TACZ on both client and server.'''
# Require the correct platform, but do not gate its version.
# [0,) also works on old Forge; an empty range is not accepted there.
[[dependencies.tacz_wall_display]]
modId="forge"
mandatory=true
versionRange="[0,)"
ordering="NONE"
side="BOTH"
[[dependencies.tacz_wall_display]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"
# Exact TACZ pin: static capture mixins use internal rendering classes and methods.
# Keep required on BOTH sides: recipes and saved original guns also need TACZ.
[[dependencies.tacz_wall_display]]
modId="tacz"
mandatory=true
versionRange="[1.1.8-hotfix]"
ordering="AFTER"
side="BOTH"
