description='''Turn equipped TACZ guns into decorative blocks. Place on six faces, rotate or turn over with a configurable item, and recover the original gun in survival.
Requires Minecraft 1.20.1, Forge 47.4.21 or later in the 47 series, and TACZ 1.1.8-hotfix (exact version). Install this mod and TACZ on both client and server.'''
