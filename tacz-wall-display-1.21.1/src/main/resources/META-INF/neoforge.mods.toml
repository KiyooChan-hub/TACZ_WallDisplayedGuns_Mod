[[mods]]
modId="tacz_wall_display"
version="0.6.6"
displayName="TACZ Wall Display"
authors="Kiyo"
description='''Press P to toggle free placement mode and place equipped TACZ guns directly as decorative blocks on six faces. Recover the original gun in survival. Legacy decorative items restore on load.
Requires Minecraft 1.21.1, NeoForge, and TACZ 1.1.8-hotfix-r6 (exact version). Recommended NeoForge: 21.1.248; no platform version requirement is imposed by this addon. Install this mod and TACZ on both client and server.'''
[[mixins]]
config="tacz_wall_display.mixins.json"
# Require the correct platform, but do not gate its version.
# [0,) also works on old Forge; an empty range is not accepted there.
[[dependencies.tacz_wall_display]]
modId="neoforge"
type="required"
versionRange="[0,)"
ordering="NONE"
side="BOTH"
[[dependencies.tacz_wall_display]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"
# Exact TACZ pin: static capture mixins use internal rendering classes and methods.
# Keep required on BOTH sides: recipes and saved original guns also need TACZ.
[[dependencies.tacz_wall_display]]
modId="tacz"
type="required"
reason="Requires the unofficial TaCZ NeoForge Port 1.1.8-hotfix-r6; static model capture uses its internal rendering API."
versionRange="[1.1.8-hotfix-r6]"
ordering="AFTER"
side="BOTH"
