[[mods]]
modId="tacz_wall_display"
version="0.6.30"
displayName="TACZ Wall Display"
authors="Kiyo"
description='''Press P to toggle free placement mode and place equipped TACZ guns directly as decorative blocks on six faces. Recover the original gun in survival. Legacy decorative items restore on load.
Requires Minecraft 1.21.1, NeoForge, and the unofficial TaCZ NeoForge Port. Recommended NeoForge: 21.1.248; no TaCZ or platform version requirement is imposed by this addon. Install this mod and TaCZ on both client and server.'''
[[mixins]]
config="tacz_wall_display.mixins.json"
# Require the correct platform, but do not gate its version.
# [0,) also works on old Forge; an empty range is not accepted there.
[[dependencies.tacz_wall_display]]
modId="neoforge"
type="required"
versionRange="[0,)"
ordering="NONE"
side="BOTH"
[[dependencies.tacz_wall_display]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"
# TaCZ remains required; its version is not gated. Internal rendering compatibility
# with versions beyond the r6 build baseline still requires runtime testing.
# Keep required on BOTH sides: recipes and saved original guns also need TACZ.
[[dependencies.tacz_wall_display]]
modId="tacz"
type="required"
reason="Requires the unofficial TaCZ NeoForge Port; static model capture uses its internal rendering API."
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
